[package]
name = "schema-gateway"
version = "0.5.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0.18"
jsonschema = "0.42.1"
axum = "0.8.8"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
prometheus = "0.14"
tower-http = { version = "0.6.8", features = ["trace", "request-id", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"

[dev-dependencies]
tempfile = "3.10"
wiremock = "0.6"
